<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0f1015}
body{margin:0;background:#0f1015;color:#e6e6ea;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;font-size:14px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px);min-height:100vh}
.c{background:#16171d;border-radius:16px;padding:12px;margin-bottom:10px}
.c.fin{opacity:.5}
.lab{color:#9ca3af;font-size:12px}
.titre{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px}
.titre h1{margin:0;font-size:24px;font-weight:600}
.grp{color:#5eead4;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.bar{height:5px;background:#262832;border-radius:3px;margin:6px 0 10px}
.bar div{height:5px;background:#2dd4bf;border-radius:3px;transition:width .25s}
.tl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.t{background:#1d1f27;border:1px solid #262832;border-radius:14px;padding:10px 8px 6px;transition:background .15s,border-color .15s}
.t.large{grid-column:1/-1}
.t.half{border-color:#1f6f66}
.t.done{background:#0d3531;border-color:#14564f}
.t.rest{border-style:dashed;background:transparent}
.tn{font-weight:600;font-size:14px;margin:0 4px 6px;display:flex;justify-content:space-between;align-items:center}
.t.done .tn{color:#5eead4}
.t.rest .tn{color:#6b7280}
.k{font-size:12px;color:#6b7280;font-weight:400}
.g{display:flex;align-items:center;gap:9px;min-height:42px;padding:4px 6px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.3;color:#e6e6ea;user-select:none;-webkit-user-select:none}
.g:active{background:#262832}
.d{width:24px;height:24px;border-radius:50%;border:2px solid #4b5563;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#0f1015;font-size:14px;transition:all .15s}
.g.ok .d{background:#2dd4bf;border-color:#2dd4bf}
.g.ok{color:#99f6e4}
.t.done .g.ok{color:#8fc9c1}
.g.attente{cursor:default;color:#6b7280}
.g.attente .d{border-style:dashed;border-color:#374151}
.mo{font-size:11px;color:#6b7280;display:block}
.g.ok .mo{color:#3f9e93}
.wait{font-size:11px;color:#fbbf24;display:block}
.wk{display:flex;gap:2px}
.wk button{flex:1;background:none;border:none;color:#9ca3af;font-size:12px;padding:0;cursor:pointer;font-family:inherit}
.wk button.sel{color:#2dd4bf;font-weight:600}
.wk button:disabled{cursor:default;opacity:.45}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f1015;border-top:1px solid #262832;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{background:none;border:none;color:#6b7280;font-size:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;cursor:pointer}
nav i{font-size:23px}
.carte{cursor:pointer}
.big{font-size:26px;font-weight:600}
.vide{text-align:center;padding:40px 10px;color:#6b7280}
.charge{text-align:center;padding:80px 0;color:#6b7280}
.etat{display:flex;justify-content:center;align-items:center;gap:6px;color:#6b7280;font-size:11px;margin:4px 0 8px}
.etat button{background:none;border:none;color:#6b7280;font-size:15px;padding:2px 4px}
.tourne{animation:t 1s linear infinite;display:inline-block}
@keyframes t{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:#3b1414;color:#fca5a5;padding:9px 14px;border-radius:10px;font-size:13px;display:none;z-index:9;max-width:90%}
input{width:100%;background:#0f1015;border:1px solid #374151;border-radius:10px;color:#e6e6ea;font-size:15px;padding:11px;margin:6px 0 12px}
.btn{width:100%;background:#2dd4bf;color:#0f1015;border:none;border-radius:12px;font-size:15px;font-weight:600;padding:12px}
/* Budget */
.h2{font-weight:600;font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.g2 .c{margin:0}
.ln{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #262832;min-height:46px}
.ln:first-of-type{border-top:none}
.ln .dt{color:#9ca3af;width:40px;font-size:12px;flex-shrink:0}
.ln .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .am{text-align:right;white-space:nowrap}
.rd{width:28px;height:28px;border-radius:50%;border:2px solid #9ca3af;background:#1d1f27;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#0f1015;font-size:15px;cursor:pointer;padding:0}

.ln.on .rd{background:#a78bfa;border-color:#a78bfa}
.ln.on .nm,.ln.on .dt{color:#6b7280}

.rv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-top:6px;min-height:48px;border:1px solid transparent}

.rv .nm{flex:1}
.rv .sub{display:block;font-size:11px;color:#6b7280}
.rv .am{white-space:nowrap;font-weight:600}

.rv.ok{background:#0f2a1a;border-color:#166534}
.rv.ok .nm{color:#bbf7d0}.rv.ok .sub{color:#4ade80}.rv.ok .am{color:#4ade80}

.pill{display:block;margin:10px auto 2px;background:#262832;border:1px solid #374151;color:#e6e6ea;font-size:12px;padding:8px 15px;border-radius:16px;cursor:pointer;font-family:inherit}
.jour{color:#9ca3af;font-size:11px;margin:10px 0 0}
.ajout{display:flex;justify-content:center;margin:2px 0 12px}
.ajout button{background:#4ade80;color:#0f1015;border:none;border-radius:24px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.feuille{background:#1d1f27;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid #2f323d}
.feuille input{margin:4px 0 10px}
.feuille .gros{font-size:26px;font-weight:600;text-align:center;height:56px}
.vert{width:100%;background:#4ade80;color:#0f1015;border:none;border-radius:12px;height:46px;font-weight:600;font-size:15px;font-family:inherit}

.mt{background:none;border:1px dashed transparent;border-radius:8px;padding:4px 6px;font:inherit;font-weight:600;color:inherit;cursor:pointer}
.rv.att .mt{color:#a7cbb4}.rv.ok .mt{color:#4ade80}
.mt:active{border-color:#4b5563}
.edit{background:#1d1f27;border:1px solid #2f323d;border-radius:14px;padding:12px;margin:6px 0 4px}
.edit input{margin:4px 0 10px}
.gris{width:100%;background:#262832;color:#e6e6ea;border:1px solid #374151;border-radius:12px;height:46px;font-weight:600;font-size:15px;font-family:inherit}
.rouge{width:100%;background:#3b1414;color:#fca5a5;border:1px solid #7f1d1d;border-radius:12px;height:44px;font-weight:600;font-size:14px;font-family:inherit}
.bascule{display:flex;background:#0f1015;border:1px solid #374151;border-radius:12px;padding:3px;margin-bottom:10px;cursor:pointer}
.sens{flex:1;text-align:center;padding:8px 0;border-radius:9px;color:#9ca3af;font-weight:600;font-size:13px}

.sens.on.ent{background:#0f3b36;color:#2dd4bf}
.ln.mv{cursor:pointer}
.wkm{display:flex;gap:4px;margin-bottom:10px}
.wkm button{flex:1;background:#16171d;border:1px solid #262832;border-radius:10px;padding:6px 0;color:#9ca3af;font-size:11px;cursor:pointer;line-height:1.35;font-family:inherit}
.wkm button.sel{border-color:#fbbf24;color:#fbbf24;font-weight:600;background:#2a2008}
.wkm b{display:block;font-size:13px;color:inherit}
.meal{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #262832}
.meal:first-of-type{border-top:none}
.meal .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#3a2a05;color:#fbbf24}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips span{background:#262832;border-radius:12px;padding:4px 9px;font-size:12px;color:#e6e6ea}
.libre{border:1px dashed #4a3a0a;border-radius:12px;padding:10px 12px;margin-top:6px;background:#1a1606}
.rap{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rap span{background:#3a2a05;color:#fbbf24;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600}
.dn{background:#1d1f27;border:1px solid #262832;border-radius:14px;padding:10px}

.ln.stock .rd{background:#fbbf24;border-color:#fbbf24}

/* Sport */
.sn{font-size:17px;font-weight:600}
.tgv{font-size:11px;color:#8fb996}
.bt{background:#262832;border:none;color:#e6e6ea;border-radius:16px;height:30px;padding:0 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #262832}
.srs{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.sr{width:32px;height:32px;border-radius:50%;border:2px solid #3a3f47;background:none;color:#9ca3af;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;cursor:pointer}
.sr.ok{background:#8fb996;border-color:#8fb996;color:#10261a}
.vv{width:100%;margin-top:10px;height:38px;border:none;border-radius:12px;background:#22322a;color:#cfe3d3;font-size:13px;font-family:inherit;cursor:pointer}
.pl{display:inline-block;background:#262832;border-radius:12px;padding:3px 9px;font-size:12px;color:#b8bec6;margin:4px 4px 0 0}
.pl.der{background:#2c4235;color:#cfe3d3}
.pl.auj{background:#8fb996;color:#10261a}
.bt.pas{height:44px;width:44px;border-radius:10px;font-size:18px;flex-shrink:0}
.ch-r{text-align:center;font-size:16px}
.coeur{background:#22322a;border-radius:12px;padding:10px 12px;margin-top:10px}
.fait{background:none;border:2px solid #3a3f47;color:#9ca3af;border-radius:16px;height:32px;padding:0 12px;font-size:13px;font-family:inherit;cursor:pointer}
.fait.ok{background:#8fb996;border-color:#8fb996;color:#10261a}
.chx{display:inline-block;border:1px solid #374151;border-radius:16px;padding:7px 12px;margin:5px 5px 0 0;cursor:pointer;font-size:13px}
.chx.on{background:#8fb996;border-color:#8fb996;color:#10261a}
.ssb{border-left:2px solid #8fb996;padding-left:10px}
.mt2{background:#1d1f27;border-radius:10px;padding:6px 9px}.mt2 div{font-size:15px;font-weight:600}
.wkm button.sel.sp{border-color:#8fb996;color:#8fb996;background:#1a261e}
.minu{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 66px);background:#1d1f27;border:1px solid #2f323d;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:4}
/* Agenda */
.aggr{display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr));gap:4px}
.agsem{font-size:11px;color:#6b7280;display:flex;align-items:center;justify-content:center}
.agj{height:56px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:5px 2px;outline:2px solid transparent;outline-offset:2px;color:#fff;user-select:none;-webkit-user-select:none}
.agj .n{font-size:15px;font-weight:600;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.agj .ic{margin-top:auto;display:flex;gap:3px;justify-content:center}
.agsg{width:19px;height:19px;border-radius:50%;background:rgba(15,16,21,.45);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle}
.agsg.big{width:26px;height:26px;font-size:15px;background:#262832;flex-shrink:0}
.agj.hors{opacity:.25;cursor:default}
.agj.auj{outline-color:#fff}
.agj.sel{box-shadow:inset 0 0 0 2px #0f1015,inset 0 0 0 4px #fff}
.agj.vide{background:transparent;border:1.5px dashed #374151;color:#9ca3af}
.agj.vide .n{text-shadow:none}
.aglg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#d1d5db;margin-top:10px;padding:0 4px;align-items:center}
.agsq{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.agt{color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.agev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #262832;margin-top:6px}
.agev+.agev{margin-top:0}
.sens.on.agon{background:#262832;color:#fff}
.agpot{display:inline-flex;align-items:center;gap:5px;border-radius:14px;padding:8px 12px;margin:0 5px 6px 0;font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;color:#fff}
.agpot.on{border-color:#fff}
.acst{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.acj{border-radius:9px;padding:4px 0 5px;color:#fff;height:54px;display:flex;flex-direction:column;align-items:center}
.acj .l{font-size:11px;opacity:.85}
.acj .n{font-size:14px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.acj .i{margin-top:auto;display:flex;gap:2px}.acj .agsg{width:16px;height:16px;font-size:10px}
.acj.auj{outline:2px solid #fff;outline-offset:1px}
.acj.vide{border:1.5px dashed #374151;color:#9ca3af}
.acp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #262832;margin-top:4px}
.acp+.acp{margin-top:0}.acp .bd{width:6px;align-self:stretch;border-radius:3px}
.agsuiv{animation:agS .22s ease-out}.agprec{animation:agP .22s ease-out}
@keyframes agS{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes agP{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
</style>

<body>
<main id="vue"><div class="charge">Chargement…</div></main>
<div class="toast" id="toast"></div>
<div class="minu" id="minu"><i class="ti ti-clock" style="font-size:20px;color:#8fb996"></i><div style="flex:1;min-width:0"><div class="lab" id="mlib" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div style="height:4px;background:#2f343c;border-radius:4px;margin-top:6px"><div id="mbar" style="height:4px;width:0;background:#8fb996;border-radius:4px"></div></div></div><div id="mtps" style="font-size:20px;font-weight:600;min-width:52px;text-align:right"></div><button class="bt" onclick="passerMinu()">Passer</button></div>
<nav id="nav"></nav>

<script>
/* ---------- Réglages : lus dans l'adresse (#api=…&k=…) ou mémorisés ---------- */
const P = new URLSearchParams(location.hash.slice(1));
if (P.get('api') && P.get('k')) { localStorage.setItem('mq_api', P.get('api')); localStorage.setItem('mq_k', P.get('k')); }
let API = localStorage.getItem('mq_api'), CLE = localStorage.getItem('mq_k');

const VERSION = '13/11 12h50';
const ONGLETS = [
  ['accueil', 'ti-home', 'Accueil', '#7dd3fc'],
  ['agenda', 'ti-calendar', 'Agenda', '#f9a8d4'],
  ['budget', 'ti-wallet', 'Budget', '#4ade80'],
  ['sport', 'ti-barbell', 'Sport', '#8fb996'],
  ['menu', 'ti-tools-kitchen-2', 'Menu', '#fbbf24'],
  ['routine', 'ti-checklist', 'Routine', '#2dd4bf']
];
let onglet = localStorage.getItem('mq_onglet') || 'accueil';
let D = null, jourVu = null, sync = false, file = Promise.resolve(), attente = 0, minuterie = null;
try { D = JSON.parse(localStorage.getItem('mq_data')); } catch (e) {}

/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }
function anneau(f, t, sz, txt) {
  const r = sz * .4, C = 2 * Math.PI * r, w = sz * .12;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#262832" stroke-width="${w}"/>` +
    (t ? `<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#2dd4bf" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - f / t)}" transform="rotate(-90 ${sz/2} ${sz/2})"/>` : '') +
    (txt ? `<text x="${sz/2}" y="${sz/2 + 5}" text-anchor="middle" fill="#e6e6ea" font-size="14" font-weight="600">${txt}</text>` : '') + '</svg>';
}
function api(params) {
  const q = new URLSearchParams(Object.assign({ k: CLE }, params));
  return fetch(API + '?' + q.toString(), { redirect: 'follow' }).then(r => r.json()).then(j => {
    if (!j.ok) throw new Error(j.erreur || 'Erreur');
    return j;
  });
}
function sauver() { try { localStorage.setItem('mq_data', JSON.stringify(D)); } catch (e) {} }
function jourActuel() { return D.jours.find(j => j.jour === jourVu) || D.jours.find(j => j.jour === D.auj); }

/* ---------- Synchronisation ---------- */
function actualiser(frais) {
  if (!API || !CLE) return;
  sync = true; dessinerEtat();
  api({ action: 'tout', frais: frais ? '1' : '0' }).then(d => {
    if (attente > 0) return; // une coche est en cours d'envoi : on garde l'affichage local
    if (!jourVu || !d.jours.some(j => j.jour === jourVu && !j.futur)) jourVu = d.auj;
    D = d; if (B.vu && D.autres && D.autres[B.vu.onglet]) B.vu = D.autres[B.vu.onglet]; sauver(); afficher();
  }).catch(e => toast('Connexion impossible : ' + e.message))
    .finally(() => { sync = false; dessinerEtat(); });
}
function actualiserBientot() { clearTimeout(minuterie); minuterie = setTimeout(() => actualiser(false), 3000); }
function dessinerEtat() {
  const el = $('etat'); if (!el) return;
  el.innerHTML = attente > 0 ? '<span class="tourne"><i class="ti ti-refresh"></i></span> Enregistrement…'
    : sync ? '<span class="tourne"><i class="ti ti-refresh"></i></span> Mise à jour…'
    : `Mis à jour à ${esc(D && D.maj)} · v. ${VERSION} <button aria-label="Actualiser" onclick="actualiser(true)"><i class="ti ti-refresh"></i></button>`;
}

/* ---------- Navigation ---------- */
function aller(o) {
  if (A.mode === 'peindre') { clearTimeout(A.minu); envoyerTypes(); A.mode = 'voir'; }
  if (o !== onglet) revenirAujourdhui();
  onglet = o; localStorage.setItem('mq_onglet', o); dessinerNav(); afficher(); window.scrollTo(0, 0);
}
/** À chaque changement d'onglet, tout revient sur la date du jour. */
function revenirAujourdhui() {
  if (D) jourVu = D.auj;
  B.vu = null; B.edit = null; B.form = false;
  M.jour = null;
  S.jour = null; S.vue = 'jour'; S.chg = null; S.ed = null;
  A.mois = null; A.sel = null; A.note = false;
}
function dessinerNav() {
  $('nav').innerHTML = ONGLETS.map(x =>
    `<button onclick="aller('${x[0]}')" style="color:${onglet === x[0] ? x[3] : '#6b7280'}"><i class="ti ${x[1]}" aria-hidden="true"></i>${x[2]}</button>`).join('');
}
function afficher() {
  if (!API || !CLE) return vueReglages();
  if (!D) { $('vue').innerHTML = '<div class="charge">Chargement…</div>'; return; }
  if (!jourVu) jourVu = D.auj;
  if (onglet === 'accueil') vueAccueil();
  else if (onglet === 'routine') vueRoutine();
  else if (onglet === 'budget') vueBudget();
  else if (onglet === 'menu') vueMenu();
  else if (onglet === 'sport') vueSport();
  else if (onglet === 'agenda') vueAgenda();
  else vueBientot();
  dessinerEtat();
}

/* ---------- Réglages (première ouverture) ---------- */
function vueReglages() {
  $('nav').style.display = 'none';

  <div class="c"><div class="lab">Adresse du script (se termine par /exec)</div><input id="iapi" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">

}
function enregistrer() {
  const a = $('iapi').value.trim(), k = $('ik').value.trim();

  localStorage.setItem('mq_api', a); localStorage.setItem('mq_k', k); API = a; CLE = k;

/* ---------- Accueil ---------- */
function vueAccueil() {
  const b = D.budget, j = D.jours.find(x => x.jour === D.auj), e = j && j.etat;
  let h = carteAgendaAccueil() + '<div class="etat" id="etat"></div>';
  if (b && !b.erreur) h += `<div class="c carte" onclick="aller('budget')"><div class="lab"><i class="ti ti-wallet"></i> Budget</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="big" style="color:${b.solde < 0 ? '#f87171' : '#4ade80'}">${eur(b.solde)}</span><span style="color:#f472b6">Bitstack ${eur(b.bitstack)}</span></div>
    <div class="lab">Fin de mois prévue ${eur(b.prevision)}${b.salaire ? ' · salaire J-' + b.salaire.dans : ''}</div></div>`;
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">${carteSport()}${carteMenu()}</div>`;
  if (e) {

    e.groupes.forEach(g => g.habitudes.forEach(x => { if (!x.repos && !x.complet) rest.push(x.nom); }));
    h += `<div class="c carte" onclick="jourVu=D.auj;aller('routine')" style="display:flex;align-items:center;gap:14px">${anneau(e.faits, e.total, 58, (e.total ? Math.round(e.faits / e.total * 100) : 0) + '%')}

  $('vue').innerHTML = h;
}
/** Carte Agenda de l'accueil : date du jour, 7 prochains jours, 5 prochaines périodes. */
function carteAgendaAccueil() {
  const auj = new Date(D.auj + 'T12:00'), J = joursAgenda(), mv = D.agenda && !D.agenda.erreur ? mouvementsAgenda() : {};
  const dt = auj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const x = J[D.auj] || {}, c = TJ[x.t];
  const lettres = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
  let bande = '';
  for (let k = 0; k < 7; k++) {
    const d = new Date(auj); d.setDate(d.getDate() + k);
    const cj = cleD(d), y = J[cj] || {}, cc = TJ[y.t];
    bande += `<div class="acj ${k === 0 ? 'auj' : ''} ${cc ? '' : 'vide'}" style="${cc ? 'background:' + cc[0] : ''}"><span class="l">${lettres[d.getDay()]}</span><span class="n">${d.getDate()}</span><span class="i">${y.n ? '<span class="agsg"><i class="ti ti-pencil"></i></span>' : ''}${mv[cj] ? '<span class="agsg"><i class="ti ti-currency-euro"></i></span>' : ''}</span></div>`;
  }
  // Périodes à venir (on regroupe les jours qui se suivent avec le même type)
  const per = [];
  for (let k = 1; k <= 90 && per.length < 6; k++) {
    const d = new Date(auj); d.setDate(d.getDate() + k);
    const y = J[cleD(d)] || {};
    const der = per[per.length - 1];
    const suit = der && der.t === y.t && Math.round((d - der.fin) / 864e5) === 1;
    if (!y.t) continue;
    if (suit) { der.fin = d; if (y.n && der.notes.indexOf(y.n) < 0) der.notes.push(y.n); }
    else per.push({ t: y.t, debut: d, fin: d, notes: y.n ? [y.n] : [] });
  }
  if (per.length === 6) per.pop();
  const fj = (d, avecMois) => { const t = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' }) + (avecMois ? ' ' + d.toLocaleDateString('fr-FR', { month: 'short' }) : ''); return t; };
  const lignes = per.map(p => {
    const mois = p.debut.getMonth() !== auj.getMonth() || p.fin.getMonth() !== auj.getMonth();
    let l = fj(p.debut, mois); if (p.fin > p.debut) l += ' – ' + fj(p.fin, mois);
    l = l.charAt(0).toUpperCase() + l.slice(1);
    return `<div class="acp"><div class="bd" style="background:${TJ[p.t][0]}"></div><div style="flex:1">${esc(l)}<div class="lab">${TJ[p.t][1]}${p.notes.length ? ' · ' + esc(p.notes.join(', ')) : ''}</div></div></div>`;
  }).join('');
  return `<div class="c carte" style="border:1px solid #3a2232" onclick="A.mois=null;A.sel=null;aller('agenda')">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="lab"><i class="ti ti-calendar" style="color:#f9a8d4"></i> Agenda · semaine ${semaineISO(auj)}</span><i class="ti ti-chevron-right" style="color:#6b7280"></i></div>
    <div style="font-size:26px;font-weight:600;margin-top:6px;line-height:1.15">${dt.charAt(0).toUpperCase() + dt.slice(1)}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px"><span class="lab" style="font-size:13px;${x.n ? 'color:#e6e6ea' : ''}">${x.n ? '<i class="ti ti-pencil"></i> ' + esc(x.n) : 'Aucune note'}</span></div>
    <div class="acst">${bande}</div>
    ${lignes ? '<div class="lab" style="margin-top:12px">À venir</div>' + lignes : ''}</div>`;
}

/* ---------- Routine ---------- */
function recalculer(e) {
  e.total = 0; e.faits = 0;
  e.groupes.forEach(g => {
    g.total = 0; g.faits = 0;
    g.habitudes.forEach(h => {
      const req = h.gestes.filter(x => x.requis);
      h.repos = !req.length; h.complet = !h.repos && req.every(x => x.fait);
      if (!h.repos) { g.total++; e.total++; if (h.complet) { g.faits++; e.faits++; } }
    });
  });
}
function cocher(gi, hi, xi) {
  const j = jourActuel(), x = j.etat.groupes[gi].habitudes[hi].gestes[xi];
  if (!x.requis && !x.fait) return;
  x.fait = !x.fait; j.vide = false;
  recalculer(j.etat); sauver(); vueRoutine();
  if (navigator.vibrate) navigator.vibrate(10);
  attente++;
  const jour = j.jour, cle = x.cle, v = x.fait;
  file = file.then(() => api({ action: 'geste', jour, cle, v: v ? '1' : '0' }))
    .catch(err => { toast("La coche n'a pas été enregistrée : " + err.message); attente = 0; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); if (!attente) actualiserBientot(); });
}
function choisirJour(j) { jourVu = j; vueRoutine(); }
function vueRoutine() {
  const J = jourActuel(), e = J.etat, pc = e.total ? Math.round(e.faits / e.total * 100) : 0;
  const lettres = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const pleins = D.jours.filter(j => !j.futur && !j.vide && j.etat.total);
  const moyenne = pleins.length ? Math.round(pleins.reduce((a, j) => a + j.etat.faits / j.etat.total, 0) / pleins.length * 100) : 0;
  let h = `<div class="titre"><div><h1 style="color:#2dd4bf">Routine</h1><div class="lab">${J.jour === D.auj ? "Aujourd'hui · " : ''}${esc(J.libelle)}</div></div>${anneau(e.faits, e.total, 60, pc + '%')}</div>
  <div class="c"><div class="wk">${D.jours.map((j, i) => `<button ${j.futur ? 'disabled' : ''} class="${j.jour === J.jour ? 'sel' : ''}" onclick="choisirJour('${j.jour}')">${anneau(j.etat ? j.etat.faits : 0, j.futur || j.vide ? 0 : j.etat.total, 36)}<div>${lettres[i]}</div></button>`).join('')}</div>
  <div class="lab" style="text-align:center;margin-top:6px">${e.faits} / ${e.total} · moyenne de la semaine ${moyenne} %${D.meilleure ? ' · série ' + esc(D.meilleure.nom) + ' ' + D.meilleure.n + ' j' : ''}</div></div>
  <div class="etat" id="etat"></div>`;
  h += e.groupes.map((g, gi) => {
    const fin = g.total && g.faits === g.total;
    return `<div class="c ${fin ? 'fin' : ''}"><div class="grp"><span>${esc(g.nom)}${fin ? ' <i class="ti ti-circle-check"></i>' : ''}</span><span class="lab">${g.faits} / ${g.total}</span></div>
    <div class="bar"><div style="width:${g.total ? g.faits / g.total * 100 : 0}%"></div></div><div class="tl">` +
    g.habitudes.map((x, hi) => {
      const req = x.gestes.filter(y => y.requis), k = req.filter(y => y.fait).length;
      const large = (hi === g.habitudes.length - 1 && g.habitudes.length % 2 === 1) || x.gestes.some(y => y.texte.length > 40);
      const cls = x.repos ? 'rest' : x.complet ? 'done' : k ? 'half' : '';
      return `<div class="t ${cls} ${large ? 'large' : ''}"><div class="tn"><span>${esc(x.nom)}</span>${req.length > 1 && !x.complet ? `<span class="k">${k}/${req.length}</span>` : x.complet ? '<i class="ti ti-circle-check" style="color:#2dd4bf;font-size:17px"></i>' : ''}</div>` +
        x.gestes.map((y, xi) => !y.requis && !y.fait
          ? `<div class="g attente"><span class="d"></span><span>${esc(y.texte)}<span class="wait">${esc(y.attente)}</span></span></div>`
          : `<div class="g ${y.fait ? 'ok' : ''}" role="checkbox" aria-checked="${y.fait}" onclick="cocher(${gi},${hi},${xi})"><span class="d">${y.fait ? '<i class="ti ti-check"></i>' : ''}</span><span>${y.moment ? `<span class="mo">${esc(y.moment)}</span>` : ''}${esc(y.texte)}</span></div>`).join('') + '</div>';
    }).join('') + '</div></div>';

  $('vue').innerHTML = h;

}

/* ---------- Budget ---------- */
let B = { passes: false, tout: false, form: false, sens: 'sortie', edit: null, vu: null, charge: false, bitAvant: null };
function eur(v) { return v == null || v === '' ? '—' : Number(v).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function signe(v, sortie) { if (v == null) return '—'; return (sortie ? (v < 0 ? '+' : '−') : (v < 0 ? '−' : '+')) + eur(Math.abs(v)); }
function arrondi(v) { return v > 0 ? Math.round((Math.ceil(v) - v) * 100) / 100 : 0; }
function bitPlus(b, d) { if (b.bitstack != null) b.bitstack = Math.round((b.bitstack + d) * 100) / 100; }
function nombre(s) { const n = parseFloat(String(s || '').replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }
function bv() { return B.vu || D.budget; }
/** Recalcul local immédiat (le tableau confirme ensuite). delta = variation du solde à la date jourOp. */
function rond(v) { return Math.round(v * 100) / 100; }
function ajusterEpargne(b, delta, jourOp) {
  const e = b.epargne; if (!e || e.fait || e.montant == null || !delta) return;
  if (jourOp && e.jour && jourOp > e.jour) return;          // après la paye : sans effet sur l'épargne
  const avant = e.montant; e.montant = Math.max(0, rond(e.montant + 0.25 * delta));
  if (b.prevision != null) b.prevision = rond(b.prevision - (e.montant - avant) - (arrondi(e.montant) - arrondi(avant)));
}
function ajusterSolde(b, d) { if (b.solde != null) b.solde = rond(b.solde + d); }

/** Envoie une écriture ; la réponse (onglet relu dans le tableau) remplace l'affichage. */
function envoyerBudget(params) {
  const b = bv();
  attente++; dessinerEtat();
  file = file.then(() => api(Object.assign({ action: 'budget', onglet: b.onglet }, params)))
    .then(r => {
      if (attente > 1 || !r.budget) return;
      if (r.budget.onglet === (D.budget && D.budget.onglet)) { D.budget = r.budget; B.vu = null; }
      else { B.vu = r.budget; D.autres = D.autres || {}; D.autres[r.budget.onglet] = r.budget; }
      sauver(); if (onglet === 'budget' || onglet === 'accueil') afficher();
    })
    .catch(err => { toast('Non enregistré : ' + err.message); attente = 0; B.vu = null; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); dessinerEtat(); });
}
function changerMois(nom) {
  B.edit = null; B.form = false;
  if (nom === D.budget.onglet) { B.vu = null; return vueBudget(); }
  const deja = D.autres && D.autres[nom];
  if (deja) { B.vu = deja; vueBudget(); window.scrollTo(0, 0); return; }   // déjà chargé : instantané
  B.charge = true; vueBudget();
  api({ action: 'budget', op: 'lire', onglet: nom })
    .then(r => { B.vu = r.budget; D.autres = D.autres || {}; D.autres[nom] = r.budget; sauver(); })
    .catch(e => toast('Connexion impossible : ' + e.message))
    .finally(() => { B.charge = false; if (onglet === 'budget') vueBudget(); });
}
function cocherBudget(type, i) {
  const b = bv();
  if (type === 'rec') {
    const x = b.recurrents[i]; x.fait = !x.fait;
    const s = x.fait ? 1 : -1; ajusterSolde(b, -s * x.montant); bitPlus(b, s * arrondi(x.montant));
    ajusterEpargne(b, -s * x.montant, x.jour);
    envoyerBudget({ op: 'cocher', r: x.r, lib: x.lib, v: x.fait ? '1' : '0' });
  } else if (type === 'rev') {
    const x = b.revenus[i]; if (!x.cochable) return; x.recu = !x.recu;
    if (x.montant != null) { const d = (x.recu ? 1 : -1) * x.montant; ajusterSolde(b, d); ajusterEpargne(b, d, x.jour); }
    envoyerBudget({ op: 'cocher', r: x.r, lib: x.lib, v: x.recu ? '1' : '0' });
  } else if (type === 'ep') {
    const x = b.epargne; if (x.montant == null) return toast("L'épargne sera calculée une fois le salaire saisi");
    x.fait = !x.fait;
    const s = x.fait ? 1 : -1; ajusterSolde(b, -s * x.montant); bitPlus(b, s * arrondi(x.montant));
    envoyerBudget({ op: 'cocher', r: x.r, lib: x.lib, v: x.fait ? '1' : '0' });
  }
  if (navigator.vibrate) navigator.vibrate(10);
  vueBudget();
}
function ouvrirEdition(t, i) { B.edit = B.edit && B.edit.t === t && B.edit.i === i ? null : { t, i }; B.form = false; vueBudget(); setTimeout(() => { const e = $('em'); if (e) e.focus(); }, 60); }
function enregistrerMontantRevenu(i) {
  const b = bv(), x = b.revenus[i], m = nombre($('em').value);
  if (m == null || m < 0) return toast('Entre un montant valide');
  const d = m - (x.montant || 0); x.montant = m; B.edit = null;
  if (x.recu) ajusterSolde(b, d);
  if (b.prevision != null) b.prevision = rond(b.prevision + d);
  if (x.recu || !x.cochable) ajusterEpargne(b, d, x.jour);   // salaire : compté le jour de paye ; CAF : si reçue
  if (b.salaire && !x.cochable && b.salaire.jour === x.jour) b.salaire.montant = m;
  vueBudget();
  envoyerBudget({ op: 'montant', r: x.r, lib: x.lib, m: String(m) });
}
function enregistrerMouvement(i) {
  const b = bv(), x = b.mouvements[i], m = nombre($('em').value), l = $('el').value.trim();
  if (!m || m <= 0) return toast('Entre un montant');
  if (!l) return toast('Entre un libellé');
  const signeM = $('es').dataset.sens === 'entree' ? -m : m;
  const ancienLib = x.lib, ancienM = x.montant;
  const d = signeM - ancienM;
  x.lib = l; x.montant = signeM; B.edit = null;
  ajusterSolde(b, -d); bitPlus(b, arrondi(signeM) - arrondi(ancienM));
  if (b.prevision != null) b.prevision = rond(b.prevision - d - (arrondi(signeM) - arrondi(ancienM)));
  if (signeM > 0 || ancienM > 0) { const dt = Math.max(signeM, 0) - Math.max(ancienM, 0); b.totMois = rond(b.totMois + dt); if (x.jour === D.auj) b.totJour = rond(b.totJour + dt); }
  ajusterEpargne(b, -d, x.jour);
  vueBudget();
  envoyerBudget({ op: 'modifier', r: x.r, ancienLib, ancienM: String(ancienM), lib: l, m: String(signeM) });
}
function supprimerMouvement(i) {
  const b = bv(), x = b.mouvements[i];
  if (!confirmer('Supprimer « ' + x.lib + ' » ?')) return;
  b.mouvements.splice(i, 1); B.edit = null;
  ajusterSolde(b, x.montant); bitPlus(b, -arrondi(x.montant));
  if (b.prevision != null) b.prevision = rond(b.prevision + x.montant + arrondi(x.montant));
  if (x.montant > 0) { b.totMois = rond(b.totMois - x.montant); if (x.jour === D.auj) b.totJour = rond(b.totJour - x.montant); }
  ajusterEpargne(b, x.montant, x.jour);
  vueBudget();
  envoyerBudget({ op: 'supprimer', r: x.r, ancienLib: x.lib, ancienM: String(x.montant) });
}
function confirmer(msg) { return window.confirm(msg); }
function basculerSens(id) { const e = $(id); e.dataset.sens = e.dataset.sens === 'entree' ? 'sortie' : 'entree'; dessinerSens(id); }
function dessinerSens(id) {
  const e = $(id); if (!e) return; const ent = e.dataset.sens === 'entree';
  e.innerHTML = `<span class="sens ${ent ? '' : 'on'}">Sortie −</span><span class="sens ${ent ? 'on ent' : ''}">Entrée +</span>`;
}
function ajouterMouvement() {
  const m = nombre($('dm').value), l = $('dl').value.trim(), ent = $('ds').dataset.sens === 'entree';
  if (!m || m <= 0) return toast('Entre un montant');
  if (!l) return toast('Entre un libellé');
  const b = bv(), v = ent ? -m : m, a = arrondi(v);
  b.mouvements.unshift({ r: 0, jour: D.auj, date: '', lib: l, montant: v });
  ajusterSolde(b, -v); bitPlus(b, a); if (b.prevision != null) b.prevision = rond(b.prevision - v - a);
  if (v > 0) { b.totJour = rond(b.totJour + v); b.totMois = rond(b.totMois + v); }
  ajusterEpargne(b, -v, D.auj);
  B.form = false; vueBudget();
  envoyerBudget({ op: 'depense', lib: l, m: String(v) });
}
function vueBudget() {
  const b = bv();
  const lst = (b && b.moisDispo) || [], pos = lst.findIndex(x => x.nom === (b && b.onglet));
  const prec = pos > 0 ? lst[pos - 1] : null, suiv = pos >= 0 && pos < lst.length - 1 ? lst[pos + 1] : null;
  const titre = `<div class="titre" style="padding-bottom:4px"><h1 style="color:#4ade80">Budget</h1>
    <div class="mois"><button ${prec ? `onclick="changerMois('${esc(prec.nom)}')"` : 'disabled'} aria-label="Mois précédent"><i class="ti ti-chevron-left"></i></button>
    <span>${esc(pos >= 0 ? lst[pos].label : (b && b.mois) || '')}</span>
    <button ${suiv ? `onclick="changerMois('${esc(suiv.nom)}')"` : 'disabled'} aria-label="Mois suivant"><i class="ti ti-chevron-right"></i></button></div></div>`;
  const ajd = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const etatMois = !b || !b.revenus ? '' : b.courant ? ' · jour ' + b.jourMois + '/' + b.nbJours : b.jourMois === 0 ? ' · commence dans ' + b.dansJours + ' j' : ' · mois terminé';
  const sousTitre = `<div class="lab" style="padding:0 4px 2px">${ajd.charAt(0).toUpperCase() + ajd.slice(1)}${etatMois}</div>`;
  if (B.charge) { $('vue').innerHTML = titre + sousTitre + '<div class="charge">Chargement…</div>'; return; }
  if (!b || b.erreur || !b.revenus) { $('vue').innerHTML = titre + `<div class="c vide">Impossible de lire cet onglet${b && b.erreur ? ' : ' + esc(b.erreur) : ''}.</div><div class="etat" id="etat"></div>`; return dessinerEtat(); }
  const flash = B.bitAvant !== null && B.bitAvant !== b.bitstack; B.bitAvant = b.bitstack;
  const fait = b.recurrents.filter(x => x.fait).length;

  const ligneRec = x => { const i = b.recurrents.indexOf(x), rentree = x.montant < 0;

/* ---------- Menu ---------- */
let M = { jour: null, tout: false };
const JOURS_FR = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
/** jsem : 0 = lundi … 6 = dimanche. Dîners en rotation du lundi au jeudi ; vendredi soir et week-end libres. */
function repasDuJour(jsem) {
  const m = D.menu || {}, d = m.diners || [];
  return { diner: jsem <= 3 && d.length ? d[jsem % d.length] : null, midiLibre: jsem >= 5, soirLibre: jsem >= 4 };
}
function jsemAuj() { return (new Date().getDay() + 6) % 7; }
function carteMenu() {
  const m = D.menu;
  if (!m || m.erreur) return `<div class="c" style="margin:0"><div class="lab"><i class="ti ti-tools-kitchen-2"></i> Menu</div><div class="lab" style="margin-top:6px">Indisponible</div></div>`;
  const r = repasDuJour(jsemAuj()), manque = m.courses.filter(x => !x.stock).length;
  return `<div class="c carte" style="margin:0" onclick="M.jour=null;aller('menu')"><div class="lab"><i class="ti ti-tools-kitchen-2"></i> Ce soir</div>
    <div class="h2" style="color:#fbbf24;margin-top:4px">${r.diner ? esc(r.diner.nom) : 'Soir libre'}</div>
    <div class="lab">${r.diner ? esc(r.diner.items.join(', ')) : 'Variée · en quantité · équilibrée'}</div>
    ${manque ? `<div style="display:inline-block;margin-top:6px;background:#3a2a05;color:#fbbf24;border-radius:8px;padding:2px 8px;font-size:12px">${manque} à acheter</div>` : ''}</div>`;
}
function cocherCourse(i) {
  const x = D.menu.courses[i]; x.stock = !x.stock; sauver(); vueMenu();
  if (navigator.vibrate) navigator.vibrate(10);
  attente++; dessinerEtat();
  file = file.then(() => api({ action: 'menu', op: 'cocher', r: x.r, lib: x.lib, v: x.stock ? '1' : '0' }))
    .catch(err => { toast('Non enregistré : ' + err.message); attente = 0; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); dessinerEtat(); });
}
function vueMenu() {
  const m = D.menu;
  if (!m || m.erreur) { $('vue').innerHTML = `<div class="titre"><h1 style="color:#fbbf24">Menu</h1></div><div class="c vide">Impossible de lire le tableau Menu${m && m.erreur ? ' : ' + esc(m.erreur) : ''}.</div><div class="etat" id="etat"></div>`; return dessinerEtat(); }
  const auj = jsemAuj(); if (M.jour === null) M.jour = auj;
  const j = M.jour, r = repasDuJour(j), lettres = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const rappel = '<div class="rap"><span>Variée</span><span>En quantité</span><span>Équilibrée</span></div>';
  const pastilles = a => `<div class="chips">${a.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  const libre = t => `<div class="h2">${t}</div><div class="libre"><div class="lab">À garder en tête</div>${rappel}</div>`;
  const nomJour = JOURS_FR[(j + 1) % 7];
  const manque = m.courses.map((x, i) => [x, i]).filter(([x]) => !x.stock);
  const ajd = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  let h = `<div class="titre"><h1 style="color:#fbbf24">Menu</h1><span class="lab">${ajd.charAt(0).toUpperCase() + ajd.slice(1)}</span></div>
  <div class="wkm">${lettres.map((l, i) => `<button class="${i === j ? 'sel' : ''}" onclick="M.jour=${i};vueMenu()">${l}<b>${i <= 3 && m.diners.length ? 'D' + (i % m.diners.length + 1) : '—'}</b>${i >= 4 ? 'libre' : i === auj ? 'auj.' : '&nbsp;'}</button>`).join('')}</div>
  <div class="c"><div class="h2" style="color:#fbbf24">${j === auj ? "Aujourd'hui" : nomJour}</div>
  <div class="meal"><div class="ic"><i class="ti ti-coffee"></i></div><div style="flex:1"><div class="h2">Petit déjeuner</div>${pastilles(m.petitDej)}</div></div>
  ${r.midiLibre ? `<div class="meal"><div class="ic"><i class="ti ti-sun"></i></div><div style="flex:1">${libre('Midi libre')}</div></div>` : ''}
  <div class="meal"><div class="ic"><i class="ti ti-moon"></i></div><div style="flex:1">${r.diner ? `<div class="h2">Dîner</div>${pastilles(r.diner.items)}` : libre('Soir libre')}</div></div></div>
  <div class="etat" id="etat"></div>
  <div class="c"><div class="h2" style="color:#fbbf24;margin-bottom:8px">Les ${m.diners.length} dîners <span class="lab" style="font-weight:400">· du lundi au jeudi</span></div>
  <div class="g2" style="margin:0">${m.diners.map((d, i) => `<div class="dn ${i === j ? 'auj' : ''}"><div class="h2" style="${i === j ? 'color:#fbbf24' : ''}">${esc(d.nom)} <span class="lab" style="font-weight:400">· ${JOURS_FR[(i % 4) + 1].slice(0, 3).toLowerCase()}.</span></div>${pastilles(d.items)}</div>`).join('')}</div></div>
  <div class="c"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h2" style="color:#fbbf24">Il manque</span><span style="background:#3a2a05;color:#fbbf24;padding:2px 9px;border-radius:8px;font-size:12px">${manque.length} article${manque.length > 1 ? 's' : ''}</span></div>
  ${manque.length ? '<div class="lab" style="margin:4px 0 2px">Coche ce que tu as acheté</div>' + manque.map(([x, i]) => `<div class="ln"><span class="nm">${esc(x.lib)}</span><button class="rd" aria-label="Acheté" onclick="cocherCourse(${i})"></button></div>`).join('') : '<div class="lab" style="padding:12px 0;text-align:center">Rien ne manque <i class="ti ti-circle-check" style="color:#4ade80"></i></div>'}
  <button class="pill" onclick="M.tout=!M.tout;vueMenu()">${M.tout ? 'Masquer' : 'Voir'} la liste complète <i class="ti ti-chevron-${M.tout ? 'up' : 'down'}"></i></button>
  ${M.tout ? '<div class="lab" style="margin:8px 0 2px">Décoche ce qui est fini pour l’ajouter à « Il manque »</div>' + m.courses.map((x, i) => `<div class="ln ${x.stock ? 'stock' : ''}"><span class="nm">${esc(x.lib)}</span><button class="rd" aria-label="En stock" onclick="cocherCourse(${i})">${x.stock ? '<i class="ti ti-check"></i>' : ''}</button></div>`).join('') : ''}</div>`;

/* ---------- Sport ---------- */
const VERT = '#8fb996';
let S = { jour: null, vue: 'jour', m: null, chg: null, ed: null };
let SER = {};
try { SER = JSON.parse(localStorage.getItem('mq_series')) || {}; } catch (e) {}
(function nettoyer() {
  const lim = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
  Object.keys(SER).forEach(k => { if (k.split('|')[0] < lim) delete SER[k]; });
})();
function sauverSeries() { try { localStorage.setItem('mq_series', JSON.stringify(SER)); } catch (e) {} }
function cleS(s) { return String(s || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function progDe(nom) { return nom && D.sport && D.sport.programme ? D.sport.programme[cleS(nom)] || null : null; }
function seancesDu(i) { const j = D.sport.jours[i]; return [['Matin', j['Matin']], ['Après-midi', j['Après-midi']]]; }
function nomJourSport(i) { const d = new Date(D.sport.jours[i].jour + 'T12:00'); const t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); }

/* Lien avec la case Sport de la Routine */
function gesteSport(jour, m) {
  const j = D.jours.find(x => x.jour === jour), cle = (D.sport.cles || {})[m];
  if (!j || !j.etat || !cle) return null;
  for (const g of j.etat.groupes) for (const h of g.habitudes) for (const x of h.gestes) if (x.cle === cle) return { j, x };
  return null;
}
function marquerSport(jour, m, v) {
  const r = gesteSport(jour, m);
  if (!r || r.x.fait === v) return;
  r.x.fait = v; r.j.vide = false; recalculer(r.j.etat); sauver();
  attente++; dessinerEtat();
  file = file.then(() => api({ action: 'geste', jour, cle: r.x.cle, v: v ? '1' : '0' }))
    .catch(err => { toast("Non enregistré : " + err.message); attente = 0; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); dessinerEtat(); if (!attente) actualiserBientot(); });
}

/* Séries cochées (gardées sur le téléphone) */
function serie(jour, m, i, k) {
  const id = jour + '|' + m + '|' + i, p = progDe(D.sport.jours[S.jour][m]), e = p.exos[i];
  const a = SER[id] || (SER[id] = []);
  a[k] = !a[k]; sauverSeries();
  if (navigator.vibrate) navigator.vibrate(10);
  if (a[k] && e.sec) lancerMinu(e.sec, e.nom);
  const cibles = p.type === 'course' ? p.exos.map((x, n) => [x, n]).filter(([x]) => !/^x$/i.test(x.rir)) : p.exos.map((x, n) => [x, n]);
  const fini = cibles.every(([x, n]) => { const s = SER[jour + '|' + m + '|' + n] || []; for (let q = 0; q < x.n; q++) if (!s[q]) return false; return true; });
  if (fini) { marquerSport(jour, m, true); toast('Séance terminée, bravo'); }
  vueSport();
}
function ronds(jour, m, i, n) {
  const s = SER[jour + '|' + m + '|' + i] || []; let h = '';
  for (let k = 0; k < n; k++) h += `<button class="sr ${s[k] ? 'ok' : ''}" aria-label="Série ${k + 1}" onclick="serie('${jour}','${m}',${i},${k})">${s[k] ? '<i class="ti ti-check"></i>' : k + 1}</button>`;
  return `<div class="srs">${h}</div>`;
}
function compte(jour, m, p) {
  let f = 0, t = 0;
  p.exos.forEach((e, i) => { if (p.type === 'course' && /^x$/i.test(e.rir)) return; t += e.n; f += (SER[jour + '|' + m + '|' + i] || []).slice(0, e.n).filter(Boolean).length; });
  return [f, t];
}

/* Minuteur de repos */
let T = { fin: 0, tot: 0, nom: '', sonne: true };
function lancerMinu(sec, nom) { T = { fin: Date.now() + sec * 1000, tot: sec, nom, sonne: false }; tickMinu(); }
function passerMinu() { T = { fin: 0, tot: 0, nom: '', sonne: true }; tickMinu(); }
function tickMinu() {
  const el = $('minu'); if (!el) return;
  el.style.display = onglet === 'sport' ? 'flex' : 'none';
  const r = Math.max(0, Math.ceil((T.fin - Date.now()) / 1000));
  if (T.tot && !r && !T.sonne) { T.sonne = true; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  $('mtps').textContent = T.tot ? Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') : '–';
  $('mbar').style.width = T.tot ? Math.round((T.tot - r) / T.tot * 100) + '%' : '0';
  $('mlib').textContent = !T.tot ? 'Repos · coche une série pour lancer' : r ? 'Repos · ' + T.nom : "C'est reparti";
}
setInterval(tickMinu, 500);

/* Charges du jour */
const FLECHE = '<i class="ti ti-arrow-right" style="font-size:12px;color:#6b7280"></i>';
function histo(e, estAuj) {
  const l = e.hist.map((c, k) => `<span class="pl ${k === e.hist.length - 1 && !e.auj ? 'der' : ''}">${esc(c)}</span>`);
  if (e.auj && estAuj) l.push(`<span class="pl auj">Aujourd'hui · ${esc(e.auj)}</span>`);
  else if (e.auj) l.push(`<span class="pl der">${esc(e.auj)}</span>`);
  return l.length ? l.join(FLECHE) : '<span class="pl">À tester</span>';
}
function decoupe(t) {
  const m = String(t || '').match(/^\s*([\d\/\s]+?)\s+([\d.,]+)\s*kg\s*$/i);
  return m ? { reps: m[1].split('/').map(x => x.trim()), kg: m[2] } : { reps: [], kg: '' };
}
function ouvrirCharge(m, i) { S.ed = S.ed === m + '|' + i ? null : m + '|' + i; vueSport(); }
function editeurCharge(e, m, i) {
  const d = decoupe(e.auj || e.hist[e.hist.length - 1]);
  let cases = '';

function pasKg(d) { const k = $('ch-kg'); const v = parseFloat(String(k.value).replace(',', '.')) || 0; k.value = String(Math.max(0, Math.round((v + d) * 10) / 10)).replace('.', ','); }

/* ---------- Agenda ---------- */
const TJ = {
  ENT: ['#e39a0a', 'Entraînement'], PAI: ['#e8590c', 'PAI'], TERRAIN: ['#d61f2c', 'Terrain'], MOKA: ['#8e1238', 'Moka'],
  WE: ['#2f6fb8', 'Week-end'], PERMS: ['#0e9f7e', 'Permissions']
};
let A = { mois: null, sel: null, mode: 'voir', pot: 'ENT', note: false, envoi: {}, minu: null };
function cleD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function semaineISO(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const j = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - j);
  const an = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - an) / 864e5 + 1) / 7);
}
function joursAgenda() { return (D.agenda && D.agenda.jours) || {}; }
/** Récurrents et salaires de tous les mois chargés, rangés par jour. */
function mouvementsAgenda() {
  const res = {}, vus = {};
  const ajout = (j, txt) => { if (j) (res[j] = res[j] || []).push(txt); };
  [D.budget].concat(Object.values(D.autres || {})).forEach(b => {
    if (!b || b.erreur || vus[b.onglet]) return; vus[b.onglet] = 1;
    (b.revenus || []).forEach(r => { if (/salaire/i.test(r.lib || '') && r.jour) ajout(r.jour, [esc(r.lib), r.montant == null ? 'à saisir' : '+' + eur(r.montant)]); });
    (b.recurrents || []).forEach(r => ajout(r.jour, [esc(r.lib), r.montant == null ? '' : (r.montant > 0 ? '−' : '+') + eur(Math.abs(r.montant))]));
  });
  return res;
}
function moisAgenda(n) { const m = A.mois; A.mois = new Date(m.getFullYear(), m.getMonth() + n, 1); A.sel = null; A.note = false; vueAgenda(); }
function toucherJour(j) {
  if (A.mode === 'peindre') {
    const J = joursAgenda(), t = A.pot === 'X' ? '' : A.pot;
    J[j] = Object.assign({ n: '' }, J[j], { t });
    A.envoi[j] = t; sauver(); vueAgenda();
    if (navigator.vibrate) navigator.vibrate(8);
    clearTimeout(A.minu); A.minu = setTimeout(envoyerTypes, 1200);
    return;
  }
  A.sel = A.sel === j ? null : j; A.note = false; vueAgenda();
}
function envoyerTypes() {
  const l = Object.keys(A.envoi).map(j => j + ':' + A.envoi[j]).join(','); A.envoi = {};
  if (!l) return;
  attente++; dessinerEtat();
  file = file.then(() => api({ action: 'agenda', op: 'types', liste: l }))
    .catch(err => { toast('Non enregistré : ' + err.message); attente = 0; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); dessinerEtat(); });
}
function enregistrerNote(suppr) {
  const j = A.sel, n = suppr ? '' : $('agn').value.trim(), J = joursAgenda();
  J[j] = Object.assign({ t: '' }, J[j], { n });

    .catch(err => { toast('Non enregistré : ' + err.message); attente = 0; actualiser(false); })
    .finally(() => { attente = Math.max(0, attente - 1); dessinerEtat(); });
}
function modeAgenda(m) { if (A.mode === 'peindre' && m !== 'peindre') { clearTimeout(A.minu); envoyerTypes(); } A.mode = m; A.note = false; vueAgenda(); }
function detailJour(j, mvts) {
  const J = joursAgenda()[j] || {}, c = TJ[J.t];

  ${c ? `<span class="agt" style="background:${c[0]}">${c[1]}</span>` : '<span class="lab">Pas encore défini</span>'}</div>`;
  if (A.note) h += `<div class="edit" style="margin-top:8px"><input id="agn" maxlength="200" value="${esc(J.n || '')}" placeholder="Bretagne">

  return h + '</div>';
}
function vueAgenda() {

  <div class="bascule" style="cursor:default"><span class="sens ${A.mode === 'voir' ? 'on agon' : ''}" onclick="modeAgenda('voir')"><i class="ti ti-eye"></i> Voir</span><span class="sens ${A.mode === 'peindre' ? 'on agon' : ''}" onclick="modeAgenda('peindre')"><i class="ti ti-brush"></i> Peindre</span></div>`;
  if (A.mode === 'peindre') h += `<div>${Object.keys(TJ).map(k => `<span class="agpot ${A.pot === k ? 'on' : ''}" style="background:${TJ[k][0]}" onclick="A.pot='${k}';vueAgenda()">${TJ[k][1]}</span>`).join('')}<span class="agpot ${A.pot === 'X' ? 'on' : ''}" style="background:#262832" onclick="A.pot='X';vueAgenda()"><i class="ti ti-eraser"></i> Effacer</span></div>
    <div class="lab" style="margin:8px 4px">${A.pot === 'X' ? 'Touche les jours à effacer' : 'Touche les jours à colorier'}</div>`;
  $('vue').innerHTML = h;
  A.anim = '';
  dessinerEtat();
}
/**
 * Glisser vers la gauche ou la droite :
 *  - sur le calendrier de l'Agenda → mois suivant / précédent ;
 *  - partout ailleurs → onglet suivant / précédent (dans l'ordre de la barre du bas).
 */
let gX = null, gY = 0, gCal = false;
document.addEventListener('touchstart', e => {
  gX = null;
  if (e.touches.length !== 1 || !API || !D || e.target.closest('nav,input,textarea,.edit,.feuille')) return;
  gX = e.touches[0].clientX; gY = e.touches[0].clientY;
  gCal = onglet === 'agenda' && !!e.target.closest('#agcal');
}, { passive: true });
document.addEventListener('touchend', e => {
  if (gX === null) return;
  const dx = e.changedTouches[0].clientX - gX, dy = e.changedTouches[0].clientY - gY; gX = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (gCal) { A.anim = dx < 0 ? 'agsuiv' : 'agprec'; moisAgenda(dx < 0 ? 1 : -1); return; }
  const i = ONGLETS.findIndex(x => x[0] === onglet), k = i + (dx < 0 ? 1 : -1);
  if (k < 0 || k >= ONGLETS.length) return;
  aller(ONGLETS[k][0]);
  const v = $('vue'); v.classList.remove('agsuiv', 'agprec'); void v.offsetWidth; v.classList.add(dx < 0 ? 'agsuiv' : 'agprec');
}, { passive: true });

/* ---------- Onglets à venir ---------- */
function vueBientot() {
  const o = ONGLETS.find(x => x[0] === onglet);
  $('vue').innerHTML = `<div class="titre"><h1 style="color:${o[3]}">${o[2]}</h1></div><div class="c vide"><i class="ti ${o[1]}" style="font-size:38px;color:${o[3]}"></i><p>Cet onglet arrive bientôt.</p></div>`;
}

/* ---------- Démarrage ---------- */
dessinerNav(); afficher(); actualiser(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !attente) actualiser(false); });
</script>
